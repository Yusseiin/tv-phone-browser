<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Test page</title>
<style>
  body { margin: 0; font: 20px system-ui, sans-serif; background: #f4f5f7; color: #111; }
  #fixed { position: absolute; left: 0; top: 0; width: 1000px; height: 600px; }
  #counter { position: absolute; left: 40px; top: 40px; width: 200px; height: 80px; font-size: 22px; }
  #q { position: absolute; left: 300px; top: 40px; width: 300px; height: 40px; font-size: 20px; }
  #color { position: absolute; left: 300px; top: 120px; width: 200px; height: 40px; font-size: 20px; }
  #alert { position: absolute; left: 40px; top: 160px; width: 200px; height: 60px; }
  #blank { position: absolute; left: 40px; top: 260px; font-size: 22px; }
  #notes { position: absolute; left: 650px; top: 40px; width: 300px; height: 100px; }
  #box { position: absolute; left: 300px; top: 200px; width: 300px; height: 150px; overflow-y: auto; border: 1px solid #999; background: #fff; }
  #box div { height: 1200px; background: linear-gradient(#fff, #9cf); }
  #spacer { position: absolute; top: 600px; height: 3000px; width: 10px; }
</style>
</head>
<body>
<div id="fixed">
  <button id="counter">Clicked 0</button>
  <form id="form" action="/submitted.html" method="get"><input id="q" name="q" placeholder="Search box"></form>
  <select id="color" aria-label="Favourite colour"><option>Red</option><option>Green</option><option>Blue</option></select>
  <button id="alert">Confirm</button>
  <a id="blank" href="/submitted.html?from=blank" target="_blank">Open in new tab</a>
  <textarea id="notes" placeholder="Notes"></textarea>
  <div id="box"><div></div></div>
</div>
<div id="spacer"></div>
<script>
  var n = 0;
  document.getElementById('counter').addEventListener('click', function () {
    n++;
    this.textContent = 'Clicked ' + n;
  });
  window.confirmResult = null;
  document.getElementById('alert').addEventListener('click', function () {
    window.confirmResult = confirm('Proceed?');
  });
</script>
</body>
</html>
